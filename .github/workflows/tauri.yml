name: Tauri shell (experimental)

# 换壳还在验证阶段，不参与正式发布；改动外壳或前端时自动构建一份测试包。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "display/src-tauri/**"
      - "display/src/**"
      - "display/windows-tts/**"
      - ".github/workflows/tauri.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: display/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: display/src-tauri

      - name: Build frontend
        working-directory: display
        run: |
          npm ci
          npm run build

      - name: Build speech adapter
        working-directory: display
        run: >
          dotnet publish windows-tts/ClassroomTts.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true -o windows-tts/bin/publish

      - name: Build Tauri bundle
        working-directory: display
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: classroom-display-tauri-windows-x64
          path: display/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
