name: Tauri shell (experimental)

# 换壳还在验证阶段，不参与正式发布；改动外壳或前端时自动构建一份测试包。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "display/src-tauri/**"
      - "display/src/**"
      - "display/windows-tts/**"
      - "display/package.json"
      - "display/vite.config.ts"
      - ".github/workflows/tauri.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: display/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: display/src-tauri

      - name: Build frontend
        working-directory: display
        run: |
          npm ci
          npm run build

      - name: Build speech adapter
        working-directory: display
        run: >
          dotnet publish windows-tts/ClassroomTts.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true -o windows-tts/bin/publish

      - name: Build Tauri bundle
        working-directory: display
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Rename installer
        shell: pwsh
        run: |
          $version = (Get-Content display/package.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem display/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path display/release | Out-Null
          $name = "Setup.Tauri.$version.exe"
          Copy-Item $exe.FullName (Join-Path display/release $name)
          $hash = (Get-FileHash (Join-Path display/release $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content display/release/SHA256SUMS-tauri.txt
          Write-Host "产物：$name（$([math]::Round((Get-Item (Join-Path display/release $name)).Length/1MB,1)) MB）"

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tauri-latest
          name: 桌面端 · Tauri 测试包（自动更新）
          body: |
            每次 Tauri 外壳构建自动覆盖更新，包含最新的弹窗、已读与开机自启改动。

            这是测试通道，正式版本仍以 `v*` 标签的 Electron 安装包为准。
          prerelease: true
          files: |
            display/release/Setup.Tauri.*.exe
            display/release/SHA256SUMS-tauri.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: classroom-display-tauri-windows-x64
          path: display/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
