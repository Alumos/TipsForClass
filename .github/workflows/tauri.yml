name: Windows client

# Electron 已退出，桌面端统一由 Tauri 构建。
# 日常推送到 main：出测试包，覆盖到 tauri-latest 预发布通道。
# 打 v* 标签：出正式安装包，作为该版本的 Release 资产。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "display/src-tauri/**"
      - "display/src/**"
      - "display/windows-tts/**"
      - "display/package.json"
      - "display/vite.config.ts"
      - ".github/workflows/tauri.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: display/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: display/src-tauri

      - name: Build frontend
        working-directory: display
        run: |
          npm ci
          npm run build

      - name: Build speech adapter
        working-directory: display
        run: >
          dotnet publish windows-tts/ClassroomTts.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true -o windows-tts/bin/publish

      - name: Build Tauri bundle
        working-directory: display
        run: npm run tauri:build

      - name: Rename installer
        shell: pwsh
        run: |
          $version = (Get-Content display/package.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem display/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path display/release | Out-Null
          $name = if ("${{ github.ref_type }}" -eq "tag") { "Setup.$version.exe" } else { "Setup.Tauri.$version.exe" }
          Copy-Item $exe.FullName (Join-Path display/release $name)
          $hash = (Get-FileHash (Join-Path display/release $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content display/release/SHA256SUMS.txt
          Write-Host "产物：$name（$([math]::Round((Get-Item (Join-Path display/release $name)).Length/1MB,1)) MB）"

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            display/release/Setup.*.exe
            display/release/SHA256SUMS.txt
          generate_release_notes: true

      - name: Publish rolling test release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tauri-latest
          name: 桌面端 · 测试包（自动更新）
          body: |
            日常构建的测试包，每次覆盖更新。
            正式版本请用 `v*` 标签的 Release。
          prerelease: true
          files: |
            display/release/Setup.Tauri.*.exe
            display/release/SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: classroom-display-windows-x64
          path: display/release/*.exe
          if-no-files-found: error
          retention-days: 14
