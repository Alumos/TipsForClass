name: Windows installer

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: display/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Windows installer
        shell: pwsh
        working-directory: display
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./package-win.ps1

      - name: Generate SHA-256 checksum
        shell: pwsh
        working-directory: display
        run: |
          $lines = Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $content = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'release/SHA256SUMS.txt'),
            $content,
            [System.Text.Encoding]::ASCII
          )
          Get-Content release/SHA256SUMS.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: classroom-display-windows-x64-${{ github.sha }}
          path: |
            display/release/*.exe
            display/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            display/release/*.exe
            display/release/SHA256SUMS.txt
          generate_release_notes: true
