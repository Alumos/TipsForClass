name: tipsforclass

services:
  api:
    image: ghcr.io/alumos/tipsforclass-api:${IMAGE_TAG:-latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_PATH: /data/notice.db
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - notice-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

  caddy:
    image: caddy:2.10-alpine
    profiles:
      - proxy
    restart: unless-stopped
    environment:
      NOTICE_DOMAIN: ${NOTICE_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  notice-data:
    name: tipsforclass-notice-data
  caddy-data:
    name: tipsforclass-caddy-data
  caddy-config:
    name: tipsforclass-caddy-config
