# 教室公告 API 的 nginx 反代配置
#
# 两种用法：
#  A. 宝塔面板：站点设置 → 反向代理 → 添加反向代理，目标 URL 填 http://127.0.0.1:8080，
#     然后把下面 location 块里与本项目相关的几行补进站点配置（宝塔默认配置已含
#     Upgrade 头，但 client_max_body_size 和超时仍建议手动确认）。
#  B. 手写配置：直接参考完整 server 块，证书路径按实际修改。
#
# 关键点：WebSocket（/ws/device）必须转发 Upgrade 头，否则大屏连不上。

# ---------- 完整 server 块参考 ----------
server {
    listen 443 ssl http2;
    server_name notice.alumos.cn;

    ssl_certificate     /www/server/panel/vhost/cert/notice.alumos.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/notice.alumos.cn/privkey.pem;

    # XLSX 名册上传，1000 人文件通常几百 KB，留足余量
    client_max_body_size 20m;

    access_log /www/wwwlogs/notice.alumos.cn.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        # 大屏长连接，别用默认 60s 掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # 这个域名只提供 API，不对外的路径一律 404，避免被当成站点扫描
    location / {
        return 404;
    }
}

# ---------- 复用现成域名时的备用写法 ----------
# 如果暂时不想为公告系统单独备案新域名，可以挂在 gomoku.alumos.cn 的路径下。
# 小程序 apiBase 写成 https://gomoku.alumos.cn/notice-api/api/v1
# nginx 里加（注意 proxy_pass 末尾的斜杠会剥掉 /notice-api 前缀）：
#
#   location /notice-api/ {
#       proxy_pass http://127.0.0.1:8080/;
#       proxy_http_version 1.1;
#       proxy_set_header Host              $host;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       proxy_read_timeout 120s;
#   }
#
# 代价：WebSocket 路径变成 /notice-api/ws/device，大屏端也要跟着改；
# 且该域名若走了 CDN，需要确认 CDN 支持 WebSocket 透传。长期仍建议独立子域名。
